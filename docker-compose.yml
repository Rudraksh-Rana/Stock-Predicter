version: '3.8'

services:
  api:
    build: .
    container_name: lstm-stock-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stock-network

  streamlit:
    image: python:3.11-slim
    container_name: lstm-stock-streamlit
    working_dir: /app
    command: >
      bash -c "pip install -q streamlit httpx plotly &&
               streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
